<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaPath — Learn Java to Job-Ready</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('javapath.theme');
        var theme = stored;
        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <a href="#/dashboard" class="skip-link">Skip to content</a>

  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Curriculum navigation">
      <div class="sidebar__header">
        <div class="sidebar__brand">
          <span class="sidebar__brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/></svg>
          </span>
          <span class="sidebar__brand-text">JavaPath</span>
        </div>
        <button class="sidebar__collapse-btn" id="sidebarCollapseBtn" type="button" aria-label="Collapse sidebar" aria-expanded="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebarNav"></nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobileDrawer">
          <span class="hamburger__line"></span>
          <span class="hamburger__line"></span>
          <span class="hamburger__line"></span>
        </button>
        <h1 class="topbar__title" id="topbarTitle">Dashboard</h1>
        <div class="topbar__actions">
          <div class="topbar__progress" title="Overall progress">
            <svg viewBox="0 0 36 36" width="28" height="28" aria-hidden="true">
              <circle cx="18" cy="18" r="15" fill="none" stroke="var(--color-border)" stroke-width="3"/>
              <circle id="topbarProgressRing" cx="18" cy="18" r="15" fill="none" stroke="var(--color-accent-strong)" stroke-width="3" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2" transform="rotate(-90 18 18)"/>
            </svg>
            <span class="topbar__progress-text" id="topbarProgressText">0%</span>
          </div>
          <button class="icon-btn" id="themeToggleBtn" type="button" aria-label="Toggle theme">
            <svg class="icon-btn__sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="icon-btn__moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <main class="content" id="mainContent" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="mobileDrawer" aria-label="Curriculum navigation" aria-hidden="true">
    <div class="drawer__header">
      <span class="drawer__title">Curriculum</span>
      <button class="icon-btn" id="drawerCloseBtn" type="button" aria-label="Close navigation menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <nav class="drawer__nav" id="drawerNav"></nav>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/storage.js"></script>
  <script src="js/data/phase1.js"></script>
  <script src="js/data/phase2.js"></script>
  <script src="js/data/phase3.js"></script>
  <script src="js/data/phase4.js"></script>
  <script src="js/data/phase5.js"></script>
  <script src="js/data/phase6.js"></script>
  <script src="js/data/phase7.js"></script>
  <script src="js/data/phase8.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/ui/sidebar.js"></script>
  <script src="js/ui/drawer.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/lesson.js"></script>
  <script src="js/views/quiz.js"></script>
  <script src="js/views/results.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
